      - design
      - manufacturing
      - synthesis
      - 3d print
      - elastomer
      - inverse design
      - tuneable
      - tunable
      - gel sensor
      - magictac
      - microfabrication
      - rapid fabrication
      - magnetic functionalization
      - active microstructure
      - sensor design
      - hardware design
      - open platform

  Multimodal_Perception:
