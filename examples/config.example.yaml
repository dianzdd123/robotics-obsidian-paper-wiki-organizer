# =============================================================================
# config.example.yaml — copy to config.yaml and edit for your setup
# =============================================================================
#
# Workflow:
#   1. python -m robotics_paper_wiki.organise_papers --mode first_run --dry-run
#   2. Review 90_Metadata/rename_log.csv
#   3. python -m robotics_paper_wiki.organise_papers --mode first_run
# =============================================================================

# ---------------------------------------------------------------------------
# Run behaviour
# ---------------------------------------------------------------------------
dry_run: true          # ALWAYS start true; switch to false only after reviewing logs
mode: "copy"           # "copy" — source PDFs are never touched

overwrite_existing_pdfs:           false   # skip dest PDF if it already exists
overwrite_existing_notes:          false   # skip note .md if it already exists
regenerate_existing_summaries:     false   # skip summary .md if it already exists

# ---------------------------------------------------------------------------
# Paths — update all of these for your machine
# ---------------------------------------------------------------------------
raw_data_root:               "/path/to/your/raw/PDFs"

new_papers_inbox:            "/path/to/your/Publications/03_New_Papers_Inbox/To_Process"
new_papers_processed_archive: "/path/to/your/Publications/03_New_Papers_Inbox/Processed_Originals"
new_papers_needs_review:     "/path/to/your/Publications/03_New_Papers_Inbox/Needs_Review"

output_root:                 "/path/to/your/Publications"
pdf_output_root:             "/path/to/your/Publications/01_Renamed_PDFs_By_Research_Theme"
notes_output_root:           "/path/to/your/Publications/02_Obsidian_Notes"
metadata_folder:             "/path/to/your/Publications/90_Metadata"

# ---------------------------------------------------------------------------
# PDF output grouping
# ---------------------------------------------------------------------------
pdf_grouping:
  first_level:  "primary_research_theme"   # top-level sub-folder
  second_level: "year"                     # nested sub-folder (4-digit year or Unknown_Year)

# ---------------------------------------------------------------------------
# Renamed filename template
# Tokens: {year}  {venue}  {kw1}  {kw2}  {kw3}  {first_author}
# ---------------------------------------------------------------------------
filename_format: "{year}-{venue}-{kw1}-{kw2}-{kw3}-{first_author}.pdf"

# ---------------------------------------------------------------------------
# Research themes  (ordered; drives PDF folder and note classification)
# ---------------------------------------------------------------------------
research_themes:
  - Design_and_Fabrication
  - Multimodal_Perception
  - Robot_Learning
  - Human_Robot_Interaction

# ---------------------------------------------------------------------------
# Applications  (used in metadata and Obsidian notes only — no PDF sub-folders)
# ---------------------------------------------------------------------------
applications:
  - Assistive_Robot
  - Robotic_Arm_Manipulation
  - Surgical_Robot
  - Micro_Nano_Robots
  - Wearable_Haptic_Device
  - Soft_Robot
  - Tactile_Sensing
  - General_Robotics

# ---------------------------------------------------------------------------
# Confidence threshold
# Papers below this score go to 00_Inbox_Review/ and low_confidence_review.csv
# ---------------------------------------------------------------------------
confidence:
  threshold: 0.50

# ---------------------------------------------------------------------------
# Theme keyword lists
# Scoring: each keyword hit in title+abstract+filename adds 1 pt;
#          title hits count double.
# ---------------------------------------------------------------------------
theme_keywords:
  Design_and_Fabrication:
    description: "Sensor design, device fabrication, hardware platforms, physical construction"
    keywords:
